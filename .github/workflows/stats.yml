name: ChapterPrep numbers
on:
  schedule:
    - cron: '17 11 * * *' # daily, about 6 am Eastern
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/stats.mjs
      - name: Commit if a number changed
        run: |
          if ! git diff --quiet README.md; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -am 'ChapterPrep numbers from chapterprep.com'
            git push
          fi
